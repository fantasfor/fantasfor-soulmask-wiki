<section class="builder-maker-page">
  <style>
    .builder-maker-page {
      --builder-panel: var(--panel);
      --builder-line: rgba(255, 255, 255, 0.08);
      --builder-text: var(--text);
      --builder-muted: var(--muted);
      --builder-cyan: var(--accent);
      --builder-shadow: rgba(0, 0, 0, 0.35);
    }

    .builder-maker-page * {
      box-sizing: border-box;
    }

    .builder-maker-page {
      width: 100%;
      min-height: calc(100vh - 130px);
      color: var(--builder-text);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 18px;
      box-shadow: 0 12px 24px var(--builder-shadow);
    }

    .builder-shell {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
    }

    .builder-title-wrap {
      display: grid;
      gap: 6px;
    }

    .builder-title {
      margin: 0;
      font-family: "Cinzel", serif;
      letter-spacing: 0.06em;
      font-size: clamp(1.35rem, 1.8vw, 2rem);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .builder-title-edit {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 4px;
      display: inline-grid;
      place-items: center;
      font-size: 0.72rem;
      color: var(--builder-muted);
    }

    .builder-subtitle {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 4px 0 0;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      color: var(--builder-muted);
      text-transform: uppercase;
    }

    .builder-meta-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #builderHeaderClass,
    .builder-meta-tribe,
    #builderHeaderTribe {
      color: #d653e2;
    }

    #builderHeaderClass {
      margin-right: 8px;
    }

    .builder-header-master {
      display: none;
      margin-right: 8px;
      color: #d653e2;
    }

    .builder-meta-tribe {
      margin-right: 8px;
    }

    #builderHeaderTitle {
      color: #ecd760;
    }

    .builder-top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .builder-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.7fr) minmax(250px, 1fr);
      gap: 12px;
      min-height: 0;
      flex: 1;
    }

    .builder-panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.18));
      border: 1px solid #686e73;
      border-radius: 4px;
      box-shadow: none;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .builder-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent 40%);
      pointer-events: none;
    }

    .panel-section-title {
      margin: 0;
      font-size: 0.94rem;
      font-family: "Cinzel", serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--builder-cyan);
    }

    .panel-block {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .panel-block:last-child {
      border-bottom: 0;
    }

    .set-bonus-panel {
      display: grid;
      gap: 10px;
    }

    .set-bonus-empty,
    .set-bonus-description,
    .set-bonus-locked {
      margin: 0;
      color: var(--builder-muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .set-bonus-card {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.18);
    }

    .set-bonus-title {
      margin: 0;
      color: var(--builder-cyan);
      font-size: 0.84rem;
      text-transform: uppercase;
    }

    .set-bonus-tier {
      margin: 0;
      color: var(--builder-text);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .set-bonus-tier strong {
      color: #ecd760;
    }

    .class-weapons-list {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      grid-column: 2;
    }

    .builder-character-area {
      position: relative;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 25px;
    }

    .armor-slots {
      display: grid;
      gap: 8px;
      justify-self: start;
    }

    .armor-slot {
      width: 56px;
      height: 56px;
      padding: 5px;
      border: 1px solid #686e73;
      background: #191a1a;
      cursor: pointer;
    }

    .armor-slot:hover,
    .armor-slot.selected {
      border-color: var(--builder-cyan);
      background: rgba(144, 209, 238, 0.1);
    }

    .armor-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .armor-slot.empty::after {
      content: "+";
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--builder-muted);
      font-size: 1.3rem;
    }

    .complete-armor-set-button {
      width: 56px;
      height: 24px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.24);
      color: var(--builder-muted);
      font-size: 0.58rem;
      cursor: pointer;
    }

    .complete-armor-set-button:hover:not(:disabled),
    .complete-armor-set-button:focus-visible:not(:disabled) {
      border-color: var(--builder-cyan);
      color: var(--builder-cyan);
      outline: none;
    }

    .complete-armor-set-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .armor-picker-inline {
      position: absolute;
      top: 25px;
      left: 84px;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 174px;
      max-height: 300px;
      padding: 6px;
      border: 1px solid #686e73;
      background: #111212;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .armor-picker-inline[hidden] {
      display: none;
    }

    .armor-picker-option {
      width: 100%;
      height: 52px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #191a1a;
      cursor: pointer;
    }

    .armor-picker-option:hover,
    .armor-picker-option:focus-visible {
      border-color: var(--builder-cyan);
      background: rgba(144, 209, 238, 0.1);
      outline: none;
    }

    .armor-picker-option img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .class-weapon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .class-weapon-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .class-weapon-level {
      color: var(--builder-muted);
      font-size: 0.72rem;
      line-height: 1;
    }

    .class-weapon-item.learned .class-weapon-level {
      color: #ff6b6b;
      font-weight: 700;
    }

    .builder-profile-image {
      width: 100%;
      max-width: 245px;
      height: 290px;
      object-fit: contain;
      justify-self: center;
      filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.45));
    }

    .talents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 16px;
      margin-bottom: 8px;
    }

    .talents-header .panel-section-title {
      font-size: 0.9rem;
    }

    .talent-selector-list {
      padding: 0 16px 14px;
      display: grid;
      gap: 10px;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 5px;
    }

    .selector-shell {
      display: grid;
      gap: 18px;
      justify-items: center;
      min-width: 0;
    }

    .selector-shell.optional-slot {
      position: relative;
    }

    .selector-tile-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      position: relative;
      background: #191a1a;
      border: 2px solid #686e73;
      transform: rotate(45deg);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .selector-tile-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform: scale(0.88);
    }

    .selector-tile-icon::after {
      content: "";
      position: absolute;
      inset: 8px;
      background-image: var(--icon-image, none);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transform: rotate(-45deg) scale(1.35);
    }

    .selector-tile-icon.empty::after {
      content: "+";
      color: #8ea2b5;
      font-size: 1.5rem;
      font-weight: 400;
      background: none;
      inset: 0;
      display: grid;
      place-items: center;
      transform: rotate(-45deg);
    }

    .selector-tile-icon:hover,
    .selector-tile-icon.selected {
      border-color: var(--builder-cyan);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.08), rgba(0, 0, 0, 0.08));
    }

    .selector-tile-icon.talent-type-gold:hover,
    .selector-tile-icon.talent-type-gold.selected {
      border-color: #d4af37;
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.14), rgba(0, 0, 0, 0.08));
    }

    .selector-tile-icon.talent-type-green:hover,
    .selector-tile-icon.talent-type-green.selected {
      border-color: #39d98a;
      background: linear-gradient(180deg, rgba(57, 217, 138, 0.14), rgba(0, 0, 0, 0.08));
    }

    .add-optional-slot {
      width: 46px;
      height: 46px;
      border: 2px dashed #686e73;
      background: #191a1a;
      color: #8ea2b5;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
    }

    .add-optional-slot:hover {
      border-color: var(--builder-cyan);
      color: var(--builder-cyan);
    }

    .remove-optional-slot {
      position: absolute;
      top: -7px;
      right: 0;
      z-index: 2;
      min-width: 16px;
      height: 16px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ff6a78;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .remove-optional-slot:hover {
      color: #ff9aa4;
    }

    .selector-label {
      width: 100%;
      text-align: center;
      font-size: 0.66rem;
      color: var(--builder-muted);
      line-height: 1.2;
      min-height: 2.4em;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .selector-options-wrap {
      min-height: 54px;
    }

    .selector-options {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid #686e73;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.22));
      max-height: 270px;
      overflow: auto;
    }

    .selector-option {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      color: var(--builder-text);
      padding: 8px 6px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      justify-items: center;
      text-align: center;
    }

    .selector-option:hover,
    .selector-option.selected {
      border-color: var(--builder-cyan);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.1), rgba(0, 0, 0, 0.16));
    }

    .selector-option-icon {
      width: 36px;
      height: 36px;
      background-image: var(--icon-image, none);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .selector-option-name {
      font-size: 0.64rem;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .talent-picker-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.62);
    }

    .talent-picker-modal[hidden] {
      display: none;
    }

    .talent-picker-dialog {
      width: min(920px, 100%);
      max-height: min(720px, calc(100vh - 40px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      padding: 18px;
      overflow: hidden;
      position: relative;
      background: #1a1a1a;
      border: 1px solid #686e73;
      border-radius: 4px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .talent-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--builder-line);
    }

    .talent-picker-title {
      margin: 0;
      font-family: "Cinzel", serif;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--builder-cyan);
    }

    .talent-picker-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #686e73;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.2));
      color: var(--builder-text);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .talent-picker-close:hover {
      border-color: var(--builder-cyan);
      color: var(--builder-cyan);
    }

    .talent-picker-search {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--builder-panel);
      color: var(--builder-text);
      padding: 10px 12px;
      font-size: 0.77rem;
      letter-spacing: 0.04em;
      outline: none;
    }

    .talent-picker-search:focus {
      border-color: var(--builder-cyan);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.08), transparent);
    }

    .talent-picker-content {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.42fr);
      gap: 14px;
      overflow: hidden;
    }

    .talent-picker-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
      padding: 10px;
      border: 1px solid #686e73;
      background: #0e0e0e;
    }

    .talent-picker-option {
      min-height: 92px;
    }

    .talent-picker-preview {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      border: 1px solid #686e73;
      background: #0e0e0e;
    }

    .talent-picker-preview h3 {
      margin: 0 0 10px;
      font-family: "Cinzel", serif;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--builder-cyan);
    }

    .talent-picker-preview p {
      margin: 0;
      color: var(--builder-muted);
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    .empty-state {
      border: 1px dashed rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.02);
      color: var(--builder-muted);
      font-size: 0.76rem;
      padding: 12px;
      text-align: center;
    }

    .action-list {
      display: grid;
      gap: 8px;
    }

    .action-card {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--builder-panel);
      color: var(--builder-text);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-size: 0.77rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: border-color 170ms ease;
    }

    .action-card small {
      display: block;
      color: var(--builder-muted);
      text-transform: none;
      letter-spacing: 0;
      margin-top: 2px;
      font-size: 0.72rem;
    }

    .action-card:hover {
      border-color: var(--builder-cyan);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.08), transparent);
    }

    .action-card.danger {
      border-color: rgba(255, 62, 80, 0.64);
      color: #ff6a78;
    }

    .builder-field {
      width: 100%;
      background: var(--builder-panel);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--builder-text);
      padding: 10px;
      font-size: 0.8rem;
      outline: none;
    }

    .builder-field:focus {
      border-color: var(--builder-cyan);
      box-shadow: 0 0 12px rgba(144, 209, 238, 0.3);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.05), transparent);
    }

    #buildTribe {
      min-height: 40px;
      padding: 10px 12px;
      border: 1px solid #686e73;
      border-radius: 2px;
      background: #191a1a;
      color: var(--builder-text);
      cursor: pointer;
      appearance: auto;
    }

    #buildTribe:hover {
      border-color: var(--builder-cyan);
      background: linear-gradient(180deg, rgba(144, 209, 238, 0.08), #191a1a);
    }

    #buildTribe:focus {
      border-color: var(--builder-cyan);
      box-shadow: 0 0 12px rgba(144, 209, 238, 0.3);
      outline: none;
    }

    #buildTribe option {
      background: #191a1a;
      color: var(--builder-text);
    }

    #buildTribe option:checked,
    #buildTribe option:hover {
      background: #232425;
      color: var(--builder-cyan);
    }

    .field-stack {
      display: grid;
      gap: 8px;
    }

    .saved-builds-list {
      padding: 10px;
      display: grid;
      gap: 10px;
      max-height: 560px;
      overflow: auto;
    }

    .saved-build-card {
      border: 1px solid #686e73;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.2));
      padding: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .saved-build-card.active {
      border-color: var(--builder-cyan);
      box-shadow: inset 0 0 0 1px rgba(144, 209, 238, 0.2);
    }

    .saved-build-name {
      margin: 0;
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--builder-text);
    }

    .saved-build-date {
      margin: 3px 0 0;
      color: var(--builder-muted);
      font-size: 0.72rem;
    }

    .saved-build-actions {
      display: flex;
      gap: 6px;
    }

    .saved-build-main {
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      width: 100%;
    }

    .saved-build-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
      color: var(--builder-text);
      cursor: pointer;
      font-size: 0.8rem;
      display: grid;
      place-items: center;
    }

    .saved-build-btn.delete {
      color: #ff6a78;
      border-color: rgba(255, 62, 80, 0.5);
    }

    .saved-build-empty {
      padding: 18px;
      text-align: center;
      color: var(--builder-muted);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      font-size: 0.8rem;
      margin: 10px;
    }

    @media (max-width: 1240px) {
      .builder-main-grid {
        grid-template-columns: 1fr;
      }

      .saved-builds-list {
        max-height: 320px;
      }
    }

    @media (max-width: 780px) {
      .builder-maker-page {
        padding: 12px;
      }

      .builder-subtitle {
        flex-wrap: wrap;
      }

      .selector-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .selector-options {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .talent-picker-content {
        grid-template-columns: 1fr;
      }

      .talent-picker-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-height: 310px;
      }

      .talent-picker-preview {
        min-height: 120px;
      }
    }
  </style>

  <div class="builder-shell">
    <div class="builder-main-grid">
      <section class="builder-panel">
        <div class="panel-block">
          <div class="builder-title-wrap">
            <h1 class="builder-title"><span id="builderHeaderName">Build sem nome</span> <span class="builder-title-edit">✎</span></h1>
            <p class="builder-subtitle">
              <span class="builder-meta-value" id="builderHeaderClass">Nao selecionada</span>
              <span class="builder-header-master" id="builderHeaderMaster">Mestre</span>
              <span class="builder-meta-tribe">&lt;Tribo <span class="builder-meta-value" id="builderHeaderTribe">Nao selecionada</span>&gt;</span>
              <span class="builder-meta-value" id="builderHeaderTitle">Nao selecionado</span>
            </p>
          </div>
        </div>

        <div class="builder-character-area">
          <div class="armor-slots" id="armorSlots" aria-label="Peças de armadura"></div>
          <div class="armor-picker-inline" id="armorPickerInline" hidden aria-label="Escolher peça de armadura"></div>
          <img class="builder-profile-image" src="assets/img/builder/personagem.webp" alt="Personagem da build" />
          <div class="class-weapons-list" id="classWeaponsList"></div>
        </div>

        <div class="talents-header">
          <h2 class="panel-section-title">Talentos</h2>
        </div>

        <div class="talent-selector-list">
          <div class="selector-grid" id="talentSelectorGrid"></div>
        </div>
      </section>

      <section class="builder-panel">
        <div class="panel-block field-stack">
          <h2 class="panel-section-title">Informacoes da Build</h2>
          <input id="buildName" class="builder-field" type="text" placeholder="Nome da Build" />
          <textarea id="buildDescription" class="builder-field" rows="3" placeholder="Descricao (opcional)"></textarea>
          <select id="buildTribe" class="builder-field">
            <option value="">Classe</option>
            <option value="warrior">Guerreiro</option>
            <option value="hunter">Caçador</option>
            <option value="guard">Guarda</option>
          </select>
        </div>

        <div class="panel-block">
          <h2 class="panel-section-title">Bônus de conjunto</h2>
          <div class="set-bonus-panel" id="setBonusPanel">
            <p class="set-bonus-empty">Equipe peças para ver os bônus.</p>
          </div>
        </div>
      </section>

      <aside class="builder-panel">
        <div class="panel-block">
          <h2 class="panel-section-title">Builds Salvas</h2>
        </div>
        <div class="saved-builds-list" id="savedBuildsList"></div>
      </aside>
    </div>
  </div>

  <input id="buildImportInput" type="file" accept="application/json,.json" hidden />

  <div class="talent-picker-modal" id="talentPickerModal" hidden>
    <section class="talent-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="talentPickerTitle">
      <div class="talent-picker-header">
        <h2 class="talent-picker-title" id="talentPickerTitle">Escolher talento</h2>
        <button type="button" class="talent-picker-close" id="talentPickerClose" aria-label="Fechar seletor de talentos">&times;</button>
      </div>
      <input id="talentPickerSearch" class="talent-picker-search" type="search" placeholder="Buscar talento..." aria-label="Buscar talento" autocomplete="off" />
      <div class="talent-picker-content">
        <div class="talent-picker-list" id="talentPickerList"></div>
        <aside class="talent-picker-preview" id="talentPickerPreview" aria-live="polite"></aside>
      </div>
    </section>
  </div>

</section>
