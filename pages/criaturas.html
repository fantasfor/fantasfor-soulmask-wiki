<section class="items-page db-page creatures-page">
  <div class="items-header">
    <h1 data-i18n="creatures.title">Criaturas</h1>
    <p class="items-subtitle" data-i18n="creatures.subtitle">Enciclopédia oficial de animais e criaturas do Soulmask.</p>
  </div>
  <div class="items-filters">
    <input type="search" id="db-search" class="items-search-input" placeholder="Buscar criaturas..." data-i18n-placeholder="creatures.search" aria-label="Buscar criaturas" data-i18n-aria="creatures.search" />
    <select id="creature-rank" class="items-search-input farming-sort" aria-label="Filtrar criaturas" data-i18n-aria="creatures.rankFilter"></select>
    <div class="items-stats"><span id="db-count" data-i18n="site.loading">Carregando...</span></div>
  </div>
  <div id="db-container" class="items-grid creatures-grid"></div>
</section>
