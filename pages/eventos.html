<section class="items-page db-page guide-page events-page">
  <div class="items-header">
    <h1 data-i18n="events.title">Eventos de invasão</h1>
    <p class="items-subtitle" data-i18n="events.subtitle">Horário de cada esquadrão de invasão no mapa, conforme a região do servidor, no seu fuso horário.</p>
  </div>

  <section class="guide-tool" aria-labelledby="ev-sq-title">
    <header class="guide-tool-head">
      <div>
        <span class="comfort-tool-tag" data-i18n="events.tag">Linha do tempo</span>
        <h2 id="ev-sq-title" data-i18n="events.squadsTitle">Eventos de invasão</h2>
        <p data-i18n="events.squadsHint">Esquadrões que aparecem no mapa em horário fixo, conforme a região do servidor.</p>
      </div>
      <div class="ev-clock" aria-live="off">
        <span class="ev-clock-time" id="ev-clock-time">--:--:--</span>
        <span class="ev-clock-date" id="ev-clock-date"></span>
        <span class="ev-clock-zone" id="ev-clock-zone"></span>
      </div>
    </header>
    <div class="guide-form">
      <label><span data-i18n="events.region">Região do servidor</span>
        <select id="ev-region" class="items-search-input">
          <option value="SouthAmerica" data-i18n="events.reg.SouthAmerica">América do Sul</option>
          <option value="America" data-i18n="events.reg.America">América do Norte</option>
          <option value="Europe" data-i18n="events.reg.Europe">Europa</option>
          <option value="Asia" data-i18n="events.reg.Asia">Ásia</option>
          <option value="Oceania" data-i18n="events.reg.Oceania">Oceania</option>
        </select></label>
      <label><span data-i18n="events.tz">Mostrar horários em</span>
        <select id="ev-tz" class="items-search-input">
          <option value="local" data-i18n="events.tzLocal">Meu fuso horário</option>
          <option value="utc">UTC</option>
        </select></label>
    </div>
    <div id="ev-squads" class="ev-timeline ev-squads" aria-live="polite"></div>
    <div id="ev-squads-next" class="ev-next"></div>
  </section>

  <section class="guide-explain" aria-labelledby="ev-info-title">
    <h2 id="ev-info-title" data-i18n="events.infoTitle">O que cada evento traz</h2>
    <div id="ev-info" class="ev-info"></div>
  </section>
</section>
