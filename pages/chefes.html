<section class="items-page db-page bosses-page">
  <div class="items-header">
    <h1 data-i18n="bosses.title">Chefes</h1>
    <p class="items-subtitle" data-i18n="bosses.subtitle">Os guardiões das pirâmides: como invocar cada dificuldade no altar, o que cada um deixa cair e os conjuntos de armadura que liberam.</p>
  </div>
  <div class="bosses-groups" id="bosses-groups" role="tablist" aria-label="Categorias" data-i18n-aria="bosses.groups">
    <button type="button" role="tab" data-group="" data-i18n="bosses.all">Todos</button>
    <button type="button" role="tab" data-group="pyramid" data-i18n="bosses.gPyramid">Chefes</button>
    <button type="button" role="tab" data-group="tribe" data-i18n="bosses.gTribe">Líderes de tribo</button>
    <button type="button" role="tab" data-group="plunderer" data-i18n="bosses.gPlunderer">Líderes saqueadores</button>
    <button type="button" role="tab" data-group="ruin" data-i18n="bosses.gRuin">Chefes de ruína</button>
  </div>
  <div class="items-filters">
    <input type="search" id="db-search" class="items-search-input" placeholder="Buscar chefes, drops ou conjuntos..." data-i18n-placeholder="bosses.search" aria-label="Buscar chefes" data-i18n-aria="bosses.search" />
    <select id="bosses-filter" class="items-search-input farming-sort" aria-label="Filtrar" data-i18n-aria="bosses.filter">
      <option value="" data-i18n="bosses.all">Todos</option>
      <option value="base" data-i18n="bosses.base">Mapa base</option>
      <option value="dlc" data-i18n="bosses.dlc">DLC</option>
    </select>
    <div class="items-stats"><span id="db-count" data-i18n="site.loading">Carregando...</span></div>
  </div>
  <div id="db-container" class="bosses-sections"></div>
</section>
