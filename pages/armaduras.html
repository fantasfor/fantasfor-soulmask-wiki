<section class="armaduras-page">
  <header class="arm-header">
    <div>
      <h1 data-i18n="armors.title">Armaduras</h1>
      <p class="arm-subtitle" data-i18n="armors.subtitle">Conjuntos de armadura, peças e bônus de conjunto.</p>
    </div>
    <div class="arm-controls">
      <div class="arm-segmented" role="group" aria-label="Versão da armadura" data-i18n-aria="armors.variant">
        <button type="button" class="arm-seg-btn" data-variant="normal" aria-pressed="false" data-i18n="armors.normal">Normal</button>
        <button type="button" class="arm-seg-btn" data-variant="advanced" aria-pressed="true" data-i18n="armors.advanced">Avançada</button>
      </div>
      <button type="button" class="arm-compare-btn" id="armaduras-compare-toggle" aria-pressed="false">
        <span aria-hidden="true">⇄</span> <span data-i18n="armors.compare">Comparar armaduras</span>
      </button>
    </div>
  </header>

  <div class="arm-layout">
    <nav class="arm-list" id="armaduras-list" aria-label="Conjuntos de armadura" data-i18n-aria="armors.all">
      <div class="armaduras-loading" data-i18n="armors.loading">Carregando armaduras...</div>
    </nav>

    <section class="arm-detail" id="armaduras-detail" aria-live="polite"></section>

    <section class="arm-detail arm-comparison" id="armaduras-comparison" hidden>
      <div class="arm-comparison-head">
        <div>
          <h2 data-i18n="armors.comparison">Comparação</h2>
          <p class="arm-subtitle" data-i18n="armors.hint">Clique em até duas armaduras para comparar.</p>
        </div>
        <button type="button" class="arm-small-btn" id="armaduras-comparison-clear" data-i18n="common.clear">Limpar</button>
      </div>
      <div class="arm-comparison-grid" id="armaduras-comparison-grid"></div>
    </section>
  </div>
</section>
